major: 9
supported_range: "9.0.0..9.24.99"
lts_versions: ["9.24"]

features:
  domain_model:
    entities:
      min_version: "9.0.0"
      mdl: "CREATE PERSISTENT ENTITY Module.Name (...)"
    non_persistent_entities:
      min_version: "9.0.0"
      mdl: "CREATE NON-PERSISTENT ENTITY Module.Name (...)"
    calculated_attributes:
      min_version: "9.0.0"
      mdl: "CALCULATED BY Module.Microflow"
    entity_generalization:
      min_version: "9.0.0"
      mdl: "EXTENDS Module.ParentEntity"
    export_levels:
      min_version: "9.3.0"
      mdl: "EXPORT LEVEL API | HIDDEN on an entity, attribute, association or enumeration"
      notes: "DomainModels Entity/Attribute/AssociationBase.exportLevel and Projects Document.exportLevel (enumerations) introduced in 9.3.0 (mendixmodelsdk 4.116.0 StructureVersionInfo); mendixlabs/mxcli#1498"

  microflows:
    basic:
      min_version: "9.0.0"
      mdl: "CREATE MICROFLOW Module.Name (...) BEGIN ... END"
    synchronize:
      min_version: "9.0.0"
      mdl: "SYNCHRONIZE ALL | $Var[, $Var...]  (nanoflow only)"
    synchronize_unsynchronized:
      min_version: "9.4.0"
      mdl: "SYNCHRONIZE UNSYNCHRONIZED  (nanoflow only)"
    show_page_with_params:
      min_version: "9.7.0"
      mdl: "SHOW PAGE Module.PageName WITH PARAMS ..."
      notes: "Pages$PageSettings.parameterMappings introduced in 9.7.0 (mendixmodelsdk StructureVersionInfo)"
    list_find_filter_by_expression:
      min_version: "9.0.3"
      mdl: "$Found = FIND $List WHERE expression; $Kept = FILTER $List WHERE expression;"
      notes: "Microflows$FindByExpression and FilterByExpression introduced in 9.0.3 (mendixmodelsdk 4.117.0); `BY Member = value` writes Microflows$Find/Filter, which every version has. The write refuses each type below it (canon.UndeclaredTypeError); check -p names the statement first (ako/mxcli#1811)."
    call_external_action:
      min_version: "9.19.0"
      mdl: "CALL EXTERNAL ACTION Module.Service.Action ();"
      notes: "Microflows$CallExternalAction introduced in 9.19.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    list_range:
      min_version: "9.24.0"
      mdl: "$Page = RANGE $List OFFSET $Offset LIMIT $Amount;"
      notes: "Microflows$ListRange introduced in 9.24.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    loop_over_list:
      min_version: "9.0.4"
      mdl: "LOOP $Item IN $List BEGIN … END LOOP;"
      notes: "Microflows$IterableList and LoopedActivity.LoopSource introduced in 9.0.4 (mendixmodelsdk 4.117.0); before, a loop stored its list on the activity itself, which mxcli does not write. The write refuses the loop below it; check -p names the statement first (ako/mxcli#1811)."
    while_loop:
      min_version: "9.0.4"
      mdl: "WHILE condition BEGIN … END WHILE;"
      notes: "Microflows$WhileLoopCondition introduced in 9.0.4 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    queued_calls:
      min_version: "9.10.0"
      mdl: "CALL MICROFLOW Module.Flow() IN QUEUE Module.Queue; CALL JAVA ACTION Module.Action() IN QUEUE Module.Queue;"
      notes: "Queues$QueueSettings and the calls' QueueSettings introduced in 9.10.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    execute_database_query:
      min_version: "9.24.0"
      mdl: "$Rows = EXECUTE DATABASE QUERY Module.Connection.Query;"
      notes: "DatabaseConnector$ExecuteDatabaseQueryAction and QueryParameterMapping introduced in 9.24.0 (mendixmodelsdk 4.117.0); mx 9.24.30 loads the action (CE1613 for a query that does not exist, not a load failure). The 10 and 11 rows said 10.6.0, a floor nothing measured (ako/mxcli#1811)."

  pages:
    basic:
      min_version: "9.0.0"
      mdl: "CREATE PAGE Module.Name (...) { ... }"
    page_parameters:
      min_version: "9.4.0"
      mdl: "CREATE PAGE Module.Name (Params: ($P: Module.Entity)) { ... }"
      notes: "Pages$PageParameter and Page.parameters introduced in 9.4.0 (mendixmodelsdk StructureVersionInfo)"

  security:
    module_roles:
      min_version: "9.0.0"
    user_roles:
      min_version: "9.0.0"
    entity_access:
      min_version: "9.0.0"

  workflows:
    basic:
      min_version: "9.0.2"
      mdl: "CREATE WORKFLOW Module.Name ..."
      notes: "Workflows$Workflow introduced in 9.0.2 (mendixmodelsdk 4.117.0); the CDN lists mxbuild 9.0.0 and 9.0.1, which have no workflows. The write refuses the type below it (canon.UndeclaredTypeError); create workflow, create or modify workflow and alter workflow are refused by check -p first (ako/mxcli#1809)."
    parallel_split:
      min_version: "9.0.0"
    user_task:
      min_version: "9.19.0"
      notes: "Workflows$UserTask is 9.0.2, but the outcome value (Workflows$UserTaskOutcome.Value) mxcli writes is 9.19.0, its task page 9.11.0 and its on-created event 9.0.5 (mendixmodelsdk 4.117.0). Measured on stamped 9.x projects: the write refuses a user task below 9.19 (ako/mxcli#1811)."
    multi_user_task:
      min_version: "9.22.0"
      mdl: "MULTI USER TASK Vote 'Vote' PAGE M.TaskPage OUTCOMES 'Yes' { } 'No' { };"
      notes: "Before 10.12 a Workflows$UserTask whose UserTaskCompletion is a MultiInputCompletion, introduced with consensus and veto in 9.22.0 (mendixmodelsdk 4.117.0; ako/mxcli#1771)."
    workflow_microflow_actions:
      min_version: "9.0.2"
      mdl: "CALL WORKFLOW Module.WF ($Ctx); SET TASK OUTCOME $Task 'Approve'; OPEN USER TASK $Task; OPEN WORKFLOW $Wf;"
      notes: "Microflows$WorkflowCallAction, SetTaskOutcomeAction, OpenUserTaskAction and OpenWorkflowAction introduced in 9.0.2 with workflows (mendixmodelsdk 4.117.0). The write refuses each type below it (canon.UndeclaredTypeError); check -p names the statement first (ako/mxcli#1787)."
    workflow_operations:
      min_version: "9.2.0"
      mdl: "WORKFLOW OPERATION ABORT $Wf REASON '…'; WORKFLOW OPERATION RESTART $Wf;"
      notes: "Microflows$WorkflowOperationAction, AbortOperation and RestartOperation introduced in 9.2.0 (mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    workflow_operation_pause_continue:
      min_version: "9.3.0"
      mdl: "WORKFLOW OPERATION PAUSE $Wf; WORKFLOW OPERATION CONTINUE $Wf;"
      notes: "Microflows$PauseOperation and ContinueOperation introduced in 9.3.0 (mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    get_workflow_data:
      min_version: "9.10.0"
      mdl: "$Data = GET WORKFLOW DATA $Wf AS Module.WF;"
      notes: "Microflows$GetWorkflowDataAction introduced in 9.10.0 (mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    workflow_operation_retry_unpause:
      min_version: "9.12.0"
      mdl: "WORKFLOW OPERATION RETRY $Wf; WORKFLOW OPERATION UNPAUSE $Wf;"
      notes: "Microflows$RetryOperation and UnpauseOperation introduced in 9.12.0, replacing ResumeOperation (9.3.0 to 9.11; mendixmodelsdk 4.117.0; ako/mxcli#1787)."
    jump_to:
      min_version: "9.0.5"
      mdl: "JUMP TO Activity;"
      notes: "Workflows$JumpToActivity introduced in 9.0.5 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    call_workflow_activity:
      min_version: "9.6.0"
      mdl: "CALL WORKFLOW Module.WF;  (an activity of a workflow)"
      notes: "Workflows$CallWorkflowActivity is 9.0.2, but the ParameterExpression mxcli writes is 9.6.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    overview_page:
      min_version: "9.11.0"
      mdl: "OVERVIEW PAGE Module.Page"
      notes: "Workflow.AdminPage, a Workflows$PageReference, introduced in 9.11.0 (mendixmodelsdk 4.117.0); before, the property was OverviewPage, which mxcli does not write (ako/mxcli#1811)."
    annotations:
      min_version: "9.15.0"
      mdl: "ANNOTATION '…' (on a workflow or an activity)"
      notes: "Workflows$Annotation and Workflow.Annotation introduced in 9.15.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."
    workflow_parameter:
      min_version: "9.18.0"
      mdl: "PARAMETER $WorkflowContext: Module.Entity"
      notes: "Workflows$Parameter is 9.6.0, its Entity 9.10.0 and its Name 9.18.0 (mendixmodelsdk 4.117.0); mxcli writes all three. Measured on stamped 9.x projects: below 9.18 the write refuses every workflow with a parameter (ako/mxcli#1811)."
    call_workflow_parameter_mappings:
      min_version: "9.18.0"
      mdl: "CALL WORKFLOW Module.WF (WorkflowContext = $Expr);  (an activity of a workflow)"
      notes: "Workflows$WorkflowCallParameterMapping and CallWorkflowActivity.ParameterMappings introduced in 9.18.0 (mendixmodelsdk 4.117.0; ako/mxcli#1811)."

  navigation:
    profiles:
      min_version: "9.0.0"
    menu_items:
      min_version: "9.0.0"
    home_pages:
      min_version: "9.0.0"
